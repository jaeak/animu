<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 -30 702 600"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fff" d="m0 0 10 5-10 5Z"/></marker></defs><text x="2" y="14" fill="#fff" font-size="14" font-weight="700" letter-spacing="1.4">ANIMU · HOW IT WORKS</text><rect width="210" height="180" x="1" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="18" y="60" fill="#777" font-size="14" font-weight="700">01 · LISTEN</text><text x="18" y="93" fill="#1f1f1f" font-size="23" font-weight="700">Spotify</text><text x="18" y="125" fill="#444" font-size="18.5">Follows the track</text><text x="18" y="151" fill="#444" font-size="18.5">you&apos;re playing via</text><text x="18" y="177" fill="#444" font-size="18.5">PKCE sign-in</text><rect width="210" height="180" x="246" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="60" fill="#777" font-size="14" font-weight="700">02 · MATCH</text><text x="263" y="93" fill="#1f1f1f" font-size="23" font-weight="700">AnimeThemes</text><text x="263" y="125" fill="#444" font-size="18.5">Matches song title</text><text x="263" y="151" fill="#444" font-size="18.5">and artist credits</text><text x="263" y="177" fill="#444" font-size="18.5">to an opening</text><rect width="210" height="180" x="491" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="508" y="60" fill="#777" font-size="14" font-weight="700">03 · FALLBACK</text><text x="508" y="93" fill="#1f1f1f" font-size="23" font-weight="700">Best guess</text><text x="508" y="125" fill="#444" font-size="18.5">Uses album info, or</text><text x="508" y="151" fill="#444" font-size="18.5">falls back to the</text><text x="508" y="177" fill="#444" font-size="18.5">song&apos;s cover art</text><rect width="210" height="180" x="1" y="330" fill="#1f1f1f" rx="16"/><text x="18" y="360" fill="#bbb" font-size="14" font-weight="700">04 · CACHE</text><text x="18" y="393" fill="#fff" font-size="23" font-weight="700">Node server</text><text x="18" y="425" fill="#e6e6e6" font-size="18.5">Saves each video</text><text x="18" y="451" fill="#e6e6e6" font-size="18.5">once, streams while</text><text x="18" y="477" fill="#e6e6e6" font-size="18.5">loading, 3 GB cap</text><rect width="210" height="180" x="246" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="360" fill="#777" font-size="14" font-weight="700">05 · PLAY</text><text x="263" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Backdrop</text><text x="263" y="425" fill="#444" font-size="18.5">Loops the opening</text><text x="263" y="451" fill="#444" font-size="18.5">full-screen behind</text><text x="263" y="477" fill="#444" font-size="18.5">your music</text><rect width="210" height="180" x="491" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="508" y="360" fill="#777" font-size="14" font-weight="700">06 · CONTROL</text><text x="508" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Controls</text><text x="508" y="425" fill="#444" font-size="18.5">Play, skip and dim</text><text x="508" y="451" fill="#444" font-size="18.5">controls synced</text><text x="508" y="477" fill="#444" font-size="18.5">with Spotify</text><g fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.6" marker-end="url(#a)"><path d="M213 120h30"/><path d="M458 120h30"/><path d="M596 212v56H106v58"/><path d="M213 420h30"/><path d="M458 420h30"/></g><text x="351" y="258" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">video match</text></svg>